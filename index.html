<title>Vanar Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f3f2f2;
    --text:#201e1d;
    --divider: color-mix(in srgb, #201e1d 40%, transparent);
    --neutral-200:#eae7e7;
    --neutral-900:#201e1d;
    --card-bg:#ffffff;

    --accent:#128a49;
    --accent-100:#eafaf0; --accent-200:#c9f0d9; --accent-300:#9fe4bc; --accent-400:#5ecb8c;
    --accent-500:#1ea15a; --accent-600:#0d6e3a; --accent-700:#0a5730; --accent-800:#073d21; --accent-900:#052616;

    --accent2:#dd1f1a;
    --accent2-100:#fdecec; --accent2-200:#f9cfcf; --accent2-300:#f2a3a3; --accent2-400:#e86f6f;
    --accent2-500:#dd2e2e; --accent2-600:#b81a17; --accent2-700:#8f1412; --accent2-800:#650f0d; --accent2-900:#3d0a09;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{ background:color-mix(in srgb, var(--accent) 30%, transparent); }
  a{ color:var(--accent-700); text-decoration:none; }
  a:hover{ color:var(--accent-600); }
  h1,h2{ margin:0; font-family:'Archivo',sans-serif; font-weight:800; text-wrap:balance; }
  button{ font-family:inherit; }
  img{ max-width:100%; }

  .wrap{ max-width:1200px; margin:0 auto; width:100%; box-sizing:border-box; }

  /* ---------- Header ---------- */
  .phonebar{ background:var(--neutral-900); color:#fff; font-size:12px; padding:6px 32px; text-align:right; }
  nav.topnav{
    border-bottom:2px solid var(--divider); padding:14px 32px; position:sticky; top:0;
    background:var(--bg); z-index:20; display:flex; align-items:center; flex-wrap:wrap; gap:16px;
  }
  nav.topnav img{ height:46px; width:auto; display:block; }
  .navlinks{ display:flex; gap:26px; flex-wrap:wrap; margin-left:8px; }
  .navlinks button{
    font-family:'Archivo',sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    font-size:13px; padding:6px 0; text-decoration:none; border:none; border-bottom:2px solid transparent;
    background:transparent; color:var(--text); cursor:pointer;
  }
  .navlinks button[aria-current="page"]{ border-bottom-color:var(--accent-700); color:var(--accent-700); }
  .navlinks button:hover{ color:var(--accent-700); }

  /* ---------- Buttons / fields ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Archivo',sans-serif; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
    padding:12px 22px; border:2px solid transparent; cursor:pointer; text-decoration:none;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-600); color:#fff; }
  .btn-ghost{ background:transparent; border-color:var(--text); color:var(--text); }
  .btn-ghost:hover{ background:var(--text); color:var(--bg); }
  .btn-block{ width:100%; }
  .btn-icon{ background:transparent; border:none; padding:4px; cursor:pointer; color:var(--text); }

  .field label{ font:700 11px 'Archivo',sans-serif; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px; }
  .input{
    font-family:'Archivo',sans-serif; font-size:14px; padding:10px 12px; border:2px solid var(--divider);
    background:#fff; color:var(--text); width:100%; border-radius:0;
  }
  .input:focus{ outline:2px solid var(--accent-500); outline-offset:-2px; }
  textarea.input{ min-height:100px; resize:vertical; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; color:#fff; padding:88px 32px; display:flex; align-items:flex-start;
    min-height:420px; box-sizing:border-box; overflow:hidden;
  }
  .hero img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .hero .overlay{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(100deg, rgba(7,38,21,.85) 0%, rgba(7,38,21,.55) 55%, rgba(7,38,21,.22) 100%);
  }
  .hero-inner{ position:relative; z-index:2; max-width:600px; }
  .hero-inner h1{ font-size:clamp(30px,4.6vw,48px); color:#fff; margin:0 0 18px; line-height:1.08; font-style:normal; }
  .hero-inner p{ font-size:16px; line-height:1.6; color:rgba(255,255,255,.92); max-width:480px; margin:0 0 28px; }
  .search-box{ background:#fff; padding:18px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; max-width:560px; }
  .search-box .field{ flex:1; min-width:140px; }
  .search-box .field label{ color:var(--text); }

  /* ---------- Sections ---------- */
  section.pad{ padding:56px 32px; }
  section.pad h2{ font-size:22px; margin:0 0 24px; }

  .value-grid, .nosotros-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0; border-top:2px solid var(--divider);
  }
  .value-grid > div, .nosotros-grid > div{
    padding:24px 20px; border-right:2px solid var(--divider); border-bottom:2px solid var(--divider);
  }
  .kicker{ font:800 12px 'Archivo',sans-serif; color:var(--accent-700); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .value-grid .body, .nosotros-grid .body{ font-size:15px; line-height:1.5; }

  .featured-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px; }

  /* ---------- Cards ---------- */
  .card{ border:2px solid var(--divider); background:var(--bg); cursor:pointer; display:flex; flex-direction:column; }
  .card .media{
    width:100%; height:170px; background:var(--neutral-200); display:flex; align-items:center; justify-content:center;
    color:color-mix(in srgb, var(--text) 50%, transparent); position:relative; overflow:hidden;
  }
  .card .media.terreno{ height:150px; }
  .card .media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .tag{
    position:absolute; top:10px; left:10px; background:var(--accent2); color:#fff;
    font:800 10px 'Archivo',sans-serif; text-transform:uppercase; letter-spacing:.05em; padding:4px 9px;
  }
  .card .share-btn{
    position:absolute; top:10px; right:10px; width:30px; height:30px; padding:0; border:none;
    background:rgba(255,255,255,.94); color:#1ea15a; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .card .share-btn:hover{ background:#fff; color:#0d6e3a; }
  .card .body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card .title{ font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; line-height:1.25; }
  .card .sub{ font-size:12px; color:color-mix(in srgb, var(--text) 55%, transparent); text-transform:uppercase; letter-spacing:.04em; }
  .card .price{ font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; color:var(--accent-700); margin-top:2px; }
  .card .specs{
    display:flex; gap:14px; font-size:12px; color:color-mix(in srgb, var(--text) 60%, transparent);
    margin-top:auto; padding-top:8px; border-top:1px solid var(--divider);
  }

  /* ---------- Listing pages ---------- */
  main.listing{ flex:1; padding:40px 32px; max-width:1200px; margin:0 auto; width:100%; }
  main.listing h1{ font-size:28px; margin:0 0 6px; }
  main.listing .count{ color:color-mix(in srgb, var(--text) 55%, transparent); margin:0 0 28px; }
  .filters{
    display:flex; gap:14px; flex-wrap:wrap; padding:18px 0;
    border-top:2px solid var(--divider); border-bottom:2px solid var(--divider); margin-bottom:28px;
  }
  .filters .field{ min-width:150px; }
  .empty-state{ padding:60px 0; text-align:center; color:color-mix(in srgb, var(--text) 55%, transparent); }

  /* ---------- Nosotros ---------- */
  main.nosotros{ flex:1; padding:48px 32px; max-width:900px; margin:0 auto; width:100%; }
  main.nosotros h1{ font-size:28px; margin:0 0 20px; }
  main.nosotros > p.lede{ font-size:16px; line-height:1.7; margin:0 0 32px; }
  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:40px; }
  .photo-grid > div{ aspect-ratio:4/3; overflow:hidden; }
  .photo-grid img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- Contacto ---------- */
  main.contacto{ flex:1; padding:48px 32px; max-width:1000px; margin:0 auto; width:100%; }
  main.contacto h1{ font-size:28px; margin:0 0 8px; }
  main.contacto > p.lede{ color:color-mix(in srgb, var(--text) 55%, transparent); margin:0 0 36px; max-width:520px; }
  .contact-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; }
  .contact-form{ display:flex; flex-direction:column; gap:18px; }
  .contact-form .row2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .sent-box{ border:2px solid var(--accent); background:var(--accent-100); padding:28px; }
  .sent-box .h{ font:800 15px 'Archivo',sans-serif; color:var(--accent-800); margin-bottom:6px; }
  .sent-box .b{ font-size:14px; color:var(--accent-800); }
  .contact-info{ display:flex; flex-direction:column; gap:0; border-top:2px solid var(--divider); }
  .contact-info .row{ padding:18px 0; border-bottom:2px solid var(--divider); display:flex; gap:12px; align-items:flex-start; }
  .contact-info svg{ flex:none; margin-top:2px; color:var(--accent-700); }
  .contact-info .label{ font:700 12px 'Archivo',sans-serif; text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
  .contact-info .value{ font-size:14px; }
  .contact-info .photo{ width:100%; height:150px; overflow:hidden; }
  .contact-info .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .social-row{ padding:18px 0; display:flex; gap:16px; }
  .social-row a{ font-size:13px; font-weight:700; }

  /* ---------- Modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(20,18,17,.6); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .backdrop.open{ display:flex; }
  .dialog{ background:var(--bg); max-width:520px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 24px 60px -20px rgba(0,0,0,.4); }
  .dialog .media{ width:100%; height:220px; overflow:hidden; background:var(--neutral-200); }
  .dialog .media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .dialog .content{ padding:28px; }
  .dialog .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
  .dialog .title{ font:800 20px 'Archivo',sans-serif; }
  .dialog .loc{ font-size:14px; color:color-mix(in srgb, var(--text) 55%, transparent); margin-bottom:18px; }
  .dialog .price{ font:800 24px 'Archivo',sans-serif; color:var(--accent-700); margin-bottom:18px; }
  .dialog .specs{
    display:flex; gap:20px; flex-wrap:wrap; border-top:2px solid var(--divider); border-bottom:2px solid var(--divider);
    padding:16px 0; margin-bottom:20px;
  }
  .dialog .specs .l{ font:700 11px 'Archivo',sans-serif; text-transform:uppercase; letter-spacing:.05em; color:color-mix(in srgb, var(--text) 55%, transparent); }
  .dialog .specs .v{ font-size:15px; font-weight:700; }
  .dialog .desc{ font-size:14px; line-height:1.6; margin:0 0 24px; }
  .dialog .actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn-whatsapp{ background:#1ea15a; color:#fff; }
  .btn-whatsapp:hover{ background:#0d6e3a; color:#fff; }

  /* ---------- Footer ---------- */
  footer{
    border-top:2px solid var(--divider); padding:28px 32px; display:flex; flex-wrap:wrap; gap:12px;
    justify-content:space-between; font-size:12px; color:color-mix(in srgb, var(--text) 55%, transparent);
  }
  footer .right{ display:flex; gap:18px; flex-wrap:wrap; }

  [hidden]{ display:none !important; }

  @media (max-width: 760px){
    .contact-grid{ grid-template-columns:1fr; }
    .photo-grid{ grid-template-columns:repeat(2,1fr); }
    .hero{ padding:56px 20px; }
  }
</style>

  const properties = propertiesRaw.map((r,i) => ({
    id:'p'+i, titulo:r[0], direccion:r[1], barrio:r[2], ciudad:r[3], categoria:r[4],
    precio:r[5], precioFmt:fmtPrice(r[5]), m2:r[6], hab:r[7], banos:r[8], tag:r[9], descripcion:r[10], foto:r[11]
  }));
  const terrenos = terrenosRaw.map((r,i) => ({
    id:'t'+i, titulo:r[0], direccion:r[1], barrio:r[2], ciudad:r[3],
    precio:r[4], precioFmt:fmtPrice(r[4]), m2:r[5], tag:r[6], descripcion:r[7], categoria:'Terreno', foto:r[8]
  }));

  const CIUDADES = ['Pergamino','Fontezuelas'];
  const inRange = (val, range) => {
    if (range === 'todos') return true;
    if (val == null) return false;
    if (range.endsWith('+')) return val >= parseInt(range);
    const [a,b] = range.split('-').map(Number);
    return val >= a && val < b;
  };

  const state = {
    view: 'inicio',
    propFilters: { categoria:'todos', ciudad:'todos', precio:'todos', hab:'todos' },
    terrenoFilters: { ciudad:'todos', precio:'todos', tamano:'todos' },
    selected: null,
    contact: { nombre:'', celular:'', email:'', ciudad:'', mensaje:'', sent:false },
  };

  const NAV = [
    { id:'inicio', label:'Inicio' },
    { id:'propiedades', label:'Propiedades' },
    { id:'terrenos', label:'Terrenos' },
    { id:'nosotros', label:'Nosotros' },
    { id:'contacto', label:'Contacto' },
  ];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function cardHtml(item, isTerreno){
    const specs = [];
    if(item.m2) specs.push(`<span>${item.m2} m²</span>`);
    if(!isTerreno && item.hab) specs.push(`<span>${item.hab} dorm</span>`);
    if(!isTerreno && item.banos) specs.push(`<span>${item.banos} baños</span>`);
    const media = item.foto
      ? `<img src="${item.foto}" alt="${esc(item.titulo)}">`
      : (isTerreno ? ICON_PIN : ICON_HOME);
    return `
      <div class="card" data-open="${item.id}">
        <div class="media${isTerreno?' terreno':''}">
          ${media}
          ${item.tag ? `<span class="tag">${esc(item.tag)}</span>` : ''}
          <a class="share-btn" href="${waShareUrl(item)}" target="_blank" rel="noopener" title="Compartir por WhatsApp" data-share="1" onclick="event.stopPropagation()">${ICON_WHATSAPP}</a>
        </div>
        <div class="body">
          <div class="title">${esc(item.titulo)}</div>
          <div class="sub">${esc(item.ciudad)} · ${isTerreno ? 'Terreno' : esc(item.categoria)}</div>
          <div class="price">${esc(item.precioFmt)}</div>
          <div class="specs">${specs.join('')}</div>
        </div>
      </div>`;
  }

  function renderNav(){
    const el = document.getElementById('navlinks');
    el.innerHTML = NAV.map(n => `<button data-view="${n.id}" aria-current="${state.view===n.id?'page':'false'}">${n.label}</button>`).join('');
  }

  function renderInicio(){
    const featured = properties.filter(p => p.tag === 'Destacado');

  function filterOptionsHtml(options, value){
    return options.map(o => `<option value="${o.value}" ${o.value===value?'selected':''}>${o.label}</option>`).join('');

  function renderPropiedades(){
    const pf = state.propFilters;
    const filtered = properties.filter(p =>
      (pf.categoria === 'todos' || p.categoria === pf.categoria) &&
      (pf.ciudad === 'todos' || p.ciudad === pf.ciudad) &&
      inRange(p.precio, pf.precio) &&
      (pf.hab === 'todos' || (pf.hab === '4+' ? (p.hab||0) >= 4 : p.hab === parseInt(pf.hab)))
    );
    const ciudadOptions = [{value:'todos',label:'Todas las ciudades'}, ...CIUDADES.map(z=>({value:z,label:z}))];
    const categoriaOptions = [{value:'todos',label:'Todas las categorías'},{value:'Casa',label:'Casas'},{value:'Departamento',label:'Departamentos'}];
    const habOptions = [{value:'todos',label:'Cualquiera'},{value:'1',label:'1'},{value:'2',label:'2'},{value:'3',label:'3'},{value:'4+',label:'4+'}];
    const precioOptions = [{value:'todos',label:'Cualquier precio'},{value:'0-60000',label:'Hasta U$S 60.000'},{value:'60000-100000',label:'U$S 60.000 - 100.000'},{value:'100000-200000',label:'U$S 100.000 - 200.000'},{value:'200000+',label:'Más de U$S 200.000'}];

    return `
      <div class="wrap">
        <h1>Propiedades</h1>
        <p class="count">${filtered.length} propiedades disponibles</p>
        <div class="filters">
          <div class="field"><label>Categoría</label><select class="input" id="f-categoria">${filterOptionsHtml(categoriaOptions, pf.categoria)}</select></div>
          <div class="field"><label>Ciudad</label><select class="input" id="f-ciudad">${filterOptionsHtml(ciudadOptions, pf.ciudad)}</select></div>
          <div class="field"><label>Precio</label><select class="input" id="f-precio">${filterOptionsHtml(precioOptions, pf.precio)}</select></div>
          <div class="field"><label>Dormitorios</label><select class="input" id="f-hab">${filterOptionsHtml(habOptions, pf.hab)}</select></div>
        </div>
        ${filtered.length
          ? `<div class="card-grid">${filtered.map(p => cardHtml(p,false)).join('')}</div>`
          : `<div class="empty-state">No hay propiedades que coincidan con estos filtros.</div>`}
      </div>`;
  }

  function renderTerrenos(){
    const tf = state.terrenoFilters;
    const filtered = terrenos.filter(t =>
      (tf.ciudad === 'todos' || t.ciudad === tf.ciudad) &&
      inRange(t.precio, tf.precio) &&
      inRange(t.m2, tf.tamano)
    );
    const ciudadOptions = [{value:'todos',label:'Todas las ciudades'}, ...CIUDADES.map(z=>({value:z,label:z}))];
    const precioOptions = [{value:'todos',label:'Cualquier precio'},{value:'0-30000',label:'Hasta U$S 30.000'},{value:'30000-45000',label:'U$S 30.000 - 45.000'},{value:'45000+',label:'Más de U$S 45.000'}];
    const tamanoOptions = [{value:'todos',label:'Cualquier tamaño'},{value:'0-200',label:'Hasta 200 m²'},{value:'200-800',label:'200 - 800 m²'},{value:'800+',label:'Más de 800 m²'}];

    return `
      <div class="wrap">
        <h1>Terrenos</h1>
        <p class="count">${filtered.length} terrenos disponibles</p>
        <div class="filters">
          <div class="field"><label>Ciudad</label><select class="input" id="f-t-ciudad">${filterOptionsHtml(ciudadOptions, tf.ciudad)}</select></div>
          <div class="field"><label>Precio</label><select class="input" id="f-t-precio">${filterOptionsHtml(precioOptions, tf.precio)}</select></div>
          <div class="field"><label>Tamaño (m²)</label><select class="input" id="f-t-tamano">${filterOptionsHtml(tamanoOptions, tf.tamano)}</select></div>
        </div>
        ${filtered.length
          ? `<div class="card-grid">${filtered.map(t => cardHtml(t,true)).join('')}</div>`
          : `<div class="empty-state">No hay terrenos que coincidan con estos filtros.</div>`}
      </div>`;
  }

  function renderContacto(){
    const c = state.contact;
    return `
      <div class="wrap">
        <h1>Contacto</h1>

        <div class="contact-grid">
          <div>
            ${c.sent ? `
              <div class="sent-box">
                <div class="h">Mensaje enviado</div>
                <div class="b">Gracias, ${esc(c.nombre)}. Un asesor te contactará pronto.</div>
              </div>
            ` : `
              <form class="contact-form" id="contactForm">
                <div class="field"><label>Nombre</label><input class="input" name="nombre" required placeholder="Tu nombre completo" value="${esc(c.nombre)}"></div>
                <div class="row2">
                  <div class="field"><label>Celular</label><input class="input" name="celular" placeholder="2477 000000" value="${esc(c.celular)}"></div>
                  <div class="field"><label>Correo electrónico</label><input class="input" type="email" name="email" required placeholder="tu@correo.com" value="${esc(c.email)}"></div>
                </div>
                <div class="field">
                  <label>Ciudad</label>
                  <select class="input" name="ciudad" required>
                    <option value="">Seleccionar</option>
                    <option value="Pergamino" ${c.ciudad==='Pergamino'?'selected':''}>Pergamino</option>
                    <option value="Fontezuelas" ${c.ciudad==='Fontezuelas'?'selected':''}>Fontezuelas</option>
                    <option value="Otra" ${c.ciudad==='Otra'?'selected':''}>Otra</option>

                <div class="field"><label>Mensaje</label><textarea class="input" name="mensaje" required placeholder="Cuéntanos qué tipo de propiedad buscas">${esc(c.mensaje)}</textarea></div>
                <button type="submit" class="btn btn-primary btn-block">Enviar mensaje</button>

  function renderApp(){
    const app = document.getElementById('app');
    if(state.view === 'inicio'){ app.className = ''; app.innerHTML = renderInicio(); }
    else if(state.view === 'propiedades'){ app.className = 'listing'; app.innerHTML = renderPropiedades(); }
    else if(state.view === 'terrenos'){ app.className = 'listing'; app.innerHTML = renderTerrenos(); }
    else if(state.view === 'nosotros'){ app.className = 'nosotros'; app.innerHTML = renderNosotros(); }
    else if(state.view === 'contacto'){ app.className = 'contacto'; app.innerHTML = renderContacto(); }
    renderNav();
    wireEvents();
    window.scrollTo(0,0);
  }

  function renderModal(){
    const backdrop = document.getElementById('backdrop');
    const panel = document.getElementById('dialogPanel');
    const item = state.selected;
    if(!item){
      backdrop.classList.remove('open'); panel.innerHTML='';
      if(location.hash) history.replaceState(null, '', location.pathname + location.search);
      return;
    }
    history.replaceState(null, '', '#' + item.id);
    const isTerreno = item.categoria === 'Terreno';
    const specs = [];
    if(item.m2) specs.push(`<div><div class="l">Superficie</div><div class="v">${item.m2} m²</div></div>`);
    if(!isTerreno && item.hab) specs.push(`<div><div class="l">Dormitorios</div><div class="v">${item.hab}</div></div>`);
    if(!isTerreno && item.banos) specs.push(`<div><div class="l">Baños</div><div class="v">${item.banos}</div></div>`);
    specs.push(`<div><div class="l">Tipo</div><div class="v">${esc(item.categoria)}</div></div>`);
    panel.innerHTML = `
      <div class="media">${item.foto ? `<img src="${item.foto}" alt="${esc(item.titulo)}">` : ''}</div>
      <div class="content">
        <div class="top">
          <div class="title">${esc(item.titulo)}</div>
          <button class="btn-icon" id="closeModal" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="loc">${esc(item.barrio)}${item.barrio?', ':''}${esc(item.ciudad)}</div>
        <div class="price">${esc(item.precioFmt)}</div>
        <div class="specs">${specs.join('')}</div>
        <p class="desc">${esc(item.descripcion)}</p>
        <div class="actions">
          <button class="btn btn-primary" id="goContacto">Solicitar información</button>
          <a class="btn btn-whatsapp" href="${waShareUrl(item)}" target="_blank" rel="noopener">${ICON_WHATSAPP} Compartir por WhatsApp</a>
        </div>
      </div>`;
    backdrop.classList.add('open');
  }

  function wireEvents(){
    document.querySelectorAll('[data-view]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        state.view = el.getAttribute('data-view');
        state.selected = null;
        renderApp();
      });
    });
    document.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-open');
        state.selected = properties.find(p=>p.id===id) || terrenos.find(t=>t.id===id);
        renderModal();
      });
    });

    const fc = document.getElementById('f-categoria');
    if(fc) fc.addEventListener('change', e => { state.propFilters.categoria = e.target.value; renderApp(); });
    const fz = document.getElementById('f-ciudad');
    if(fz) fz.addEventListener('change', e => { state.propFilters.ciudad = e.target.value; renderApp(); });
    const fp = document.getElementById('f-precio');
    if(fp) fp.addEventListener('change', e => { state.propFilters.precio = e.target.value; renderApp(); });
    const fh = document.getElementById('f-hab');
    if(fh) fh.addEventListener('change', e => { state.propFilters.hab = e.target.value; renderApp(); });

    const tz = document.getElementById('f-t-ciudad');
    if(tz) tz.addEventListener('change', e => { state.terrenoFilters.ciudad = e.target.value; renderApp(); });
    const tp = document.getElementById('f-t-precio');
    if(tp) tp.addEventListener('change', e => { state.terrenoFilters.precio = e.target.value; renderApp(); });
    const tt = document.getElementById('f-t-tamano');
    if(tt) tt.addEventListener('change', e => { state.terrenoFilters.tamano = e.target.value; renderApp(); });

    const form = document.getElementById('contactForm');
    if(form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      state.contact = {
        nombre: fd.get('nombre') || '', celular: fd.get('celular') || '', email: fd.get('email') || '',
        ciudad: fd.get('ciudad') || '', mensaje: fd.get('mensaje') || '', sent: true
      };
      renderApp();
    });
  }

  document.getElementById('backdrop').addEventListener('click', (e) => {
    if(e.target.id === 'backdrop'){ state.selected = null; renderModal(); }
  });
  document.addEventListener('click', (e) => {
    if(e.target.id === 'closeModal'){ state.selected = null; renderModal(); }
    if(e.target.id === 'goContacto'){ state.selected = null; renderModal(); state.view = 'contacto'; renderApp(); }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && state.selected){ state.selected = null; renderModal(); }
  });

  renderApp();

  // si llegan desde un link compartido (#p5, #t2), abrir directamente esa propiedad
  const initialId = location.hash.replace('#', '');
  if(initialId){
    const found = properties.find(p=>p.id===initialId) || terrenos.find(t=>t.id===initialId);
    if(found){ state.selected = found; renderModal(); }
  }
})();
</script>
